# Colosseum Native settings (also editable from the in-game menu: Esc or F1).
# Same layout as MZNative.ini. Values marked (restart) apply on next launch.
[display]
DisplayMode = 1        ; 0 windowed, 1 borderless fullscreen, 2 exclusive fullscreen
ExclusiveWidth = 0
ExclusiveHeight = 0
ExclusiveRefresh = 0   ; 0 = desktop rate
WindowScale = 3
Aspect = 1             ; 0 original 4:3, 1 widescreen 16:9, 2 ultrawide 21:9, 3 super-ultrawide 32:9, 4 stretch
VSync = 1
ShowFps = 0
Renderer = 0           ; 0 auto, 1 Vulkan, 2 Direct3D 12, 3 Direct3D 11, 4 OpenGL (restart)
HDR = 0
[framerate]
FrameRateTarget = 144  ; 30, 60, 120, 144, 165, 240, 0 = match display
FrameGeneration = 1    ; 0 off (original speed, repeated frames), 1 interpolated frames
[resolution]
InternalResolution = 0 ; 0 auto (match window), 1-8 = 1x (640x528) to 8x; 6x = 4K
OutputResampling = 0   ; 0 default, 1 bilinear, 2 bicubic, 3 sharp bilinear, 4 area
[antialiasing]
MSAA = 4               ; 1, 2, 4, 8
SSAA = 0               ; supersample instead of multisample
[textures]
AnisotropicFiltering = 4  ; 0 1x, 1 2x, 2 4x, 3 8x, 4 16x
TextureFiltering = 0      ; 0 default, 1 force nearest, 2 force linear
HiresTextures = 1         ; load texture packs from Load/Textures/GC6E01
ArbitraryMipmapDetection = 1
ForceTrueColor = 1
[lighting]
PerPixelLighting = 1
DisableFog = 0
ShadowQuality = 2      ; 0 original, 1 high, 2 ultra (higher-res shadow copies)
[postprocessing]
Shader =               ; file name in Shaders/, empty = none
Sharpening = 0         ; 0-100
ColorCorrection = 1    ; correct the GameCube's colour space and gamma
Brightness = 1
Contrast = 1
Saturation = 1
Gamma = 1
[performance]
ShaderCompilation = 2  ; 0 synchronous, 1 ubershaders, 2 async + ubershaders (no stutter)
PrecompileShaders = 1
[speed]
SpeedPercent = 100
FastForward = 4        ; 0 = unlimited
PauseInMenu = 1
[audio]
Volume = 100
Mute = 0
[input]
StickDeadzone = 15     ; percent
CameraStick = 1        ; C-stick camera where the game allows it
[general]
StateSlot = 1
LastDisc =
